<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="/static/style.css">
    <title>Matches</title>
</head>
<body>
    <h1>Matches</h1>
    <a href="/matches/add">Schedule New Match</a>
    <br><br>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Tournament ID</th>
            <th>Team 1 ID</th>
            <th>Team 2 ID</th>
            <th>Match Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        {% for match in matches %}
        <tr>
            <td>{{ match.match_id }}</td>
            <td>{{ match.tournament_id }}</td>
            <td>{{ match.team1_id }}</td>
            <td>{{ match.team2_id }}</td>
            <td>{{ match.match_date }}</td>
            <td>{{ match.status }}</td>
            <td><a href="/matches/delete/{{ match.match_id }}" onclick="return confirm('Are you sure?')">Delete</a></td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/">Back to Dashboard</a>
</body>
</html>
