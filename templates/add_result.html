<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <title>Add Result</title>
</head>
<body>
<nav class="navbar">
    <div class="navbar-inner">
        <a class="brand" href="/"><span class="logo"></span>Tournament Manager</a>
        <ul class="nav-links">
            <li><a href="/players">Players</a></li>
            <li><a href="/teams">Teams</a></li>
            <li><a href="/games">Games</a></li>
            <li><a href="/tournaments">Tournaments</a></li>
            <li><a href="/registrations">Registrations</a></li>
            <li><a href="/matches">Matches</a></li>
            <li><a class="active" href="/results">Results</a></li>
        </ul>
        <div class="nav-actions">
            <a class="btn btn-danger" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<main>
    <div class="container">
        <div class="page-head">
            <h1>Record Match Result</h1>
        </div>

        <div class="form-card">
            <form action="/results/add" method="POST">
                <div class="field">
                    <label>Match (Select one)</label>
                    <select name="match_id" required>
                        {% for match in matches %}
                            <option value="{{ match.match_id }}">Match {{ match.match_id }} ({{ match.match_date }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Winner Team (Select one)</label>
                    <select name="winner_team_id" required>
                        {% for team in teams %}
                            <option value="{{ team.team_id }}">{{ team.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Score Team 1</label>
                    <input type="number" name="score_team1" required>
                </div>
                <div class="field">
                    <label>Score Team 2</label>
                    <input type="number" name="score_team2" required>
                </div>
                <input type="submit" value="Record Result">
            </form>
            <div class="form-footer">
                <a class="btn btn-ghost" href="/results">Back to Results</a>
            </div>
        </div>
    </div>
</main>

<footer class="footer">Gaming Tournament Management System &copy; 2026</footer>
</body>
</html>
